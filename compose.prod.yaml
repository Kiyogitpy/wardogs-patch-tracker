# Production stack: Caddy (TLS) -> app (API + web) -> Postgres. Run from this folder:
#   cp deploy/.env.example .env && edit .env
#   docker compose -f compose.prod.yaml up -d --build
#
# Networks: `edge` (caddy + app) and `backend` (app + db, no outside access). Only caddy publishes
# ports. Caddy has a fixed address on `edge` (CADDY_IP) and uvicorn trusts X-Forwarded-For from that
# one address only. EDGE_SUBNET, EDGE_GATEWAY and CADDY_IP are defined once below (x-edge-*) and used
# by the network and by the trust settings, so they cannot drift. Defaults differ between this file
# and the other stack, so both can run on one host.
#
# Restart policy: "unless-stopped" restarts a container that EXITS, but Docker never restarts one
# that is merely "unhealthy". Healthchecks here gate start order and show in `docker compose ps`.
# A hung (not crashed) service needs `docker compose restart <name>` or an external watchdog.
x-edge-subnet: &edge_subnet ${EDGE_SUBNET:-172.29.57.0/24}
x-edge-gateway: &edge_gateway ${EDGE_GATEWAY:-172.29.57.1}
# Top of the subnet: Docker hands dynamic addresses out from the bottom, so app/db never take it first.
x-caddy-ip: &caddy_ip ${CADDY_IP:-172.29.57.254}
# Rotated json logs for every service: an unrotated json-file log grows until the disk is full.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging

services:
  db:
    <<: *hardening
    image: postgres:16.15
    mem_limit: 1g
    pids_limit: 300
    environment:
      # The owner role. Used only by `migrate`; the app connects as tracker_app (see DEPLOY.md).
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  # One-shot: alembic as the owner role, then create/refresh the DML-only tracker_app role.
  migrate:
    image: ${APP_IMAGE:-wardogs-patch-tracker:latest}
    build: .
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    logging: *logging
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 100
    command: ["python", "/app/deploy/db_setup.py"]
    environment:
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL:?set MIGRATE_DATABASE_URL in .env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  app:
    <<: *hardening
    image: ${APP_IMAGE:-wardogs-patch-tracker:latest}
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 200
    # Listed one by one so the owner URL (MIGRATE_DATABASE_URL) never enters this container.
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # Trust X-Forwarded-For only from Caddy's own address (it sets it to the client address).
      FORWARDED_ALLOW_IPS: *caddy_ip
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Not published to the host: only Caddy reaches it over the edge network.
    networks: [edge, backend]

  caddy:
    <<: *hardening
    # Caddy with the built web app baked in at /srv (Dockerfile target `caddy`), non-root.
    image: ${CADDY_IMAGE:-wardogs-patch-tracker-caddy:latest}
    build:
      context: .
      target: caddy
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    pids_limit: 200
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}  # target of the http -> https redirect
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"  # HTTP/3 (QUIC)
    volumes:
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      edge:
        ipv4_address: *caddy_ip

networks:
  edge:
    ipam:
      config:
        - subnet: *edge_subnet
          gateway: *edge_gateway
  backend:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
